<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhysBox VR · Admin</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7; --accent:#ff8a1f; --red:#ff5a5a; --green:#4cd38a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header h1 b { color:var(--accent); }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:24px 28px 60px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:20px; }
  .card h2 { margin:0 0 12px; font-size:15px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  input, button { font:inherit; color:inherit; }
  input { background:#0c0e12; border:1px solid var(--line); border-radius:7px; padding:9px 11px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#111; border:0; border-radius:7px; padding:9px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:500; }
  button.danger { background:transparent; color:var(--red); border:1px solid #5a2a2a; font-weight:500; padding:6px 10px; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row input.code { width:130px; text-transform:uppercase; font-family:ui-monospace, Consolas, monospace; }
  .row input.grow { flex:1; min-width:200px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  td.mono { font-family:ui-monospace, Consolas, monospace; }
  td.when { color:var(--muted); white-space:nowrap; font-size:13px; }
  .empty { color:var(--muted); padding:14px 8px; }
  .msg { min-height:20px; font-size:13px; margin-top:10px; }
  .msg.err { color:var(--red); } .msg.ok { color:var(--green); }
  #login { max-width:420px; margin:60px auto; }
  .hint { color:var(--muted); font-size:13px; margin-top:8px; }
  .search { margin-left:auto; width:200px; }
</style>
</head>
<body>
<header>
  <h1>PHYSBOX <b>VR</b> · Admin</h1>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout" hidden>Sign out</button>
</header>

<main>
  <section class="card" id="login" hidden>
    <h2>Sign in</h2>
    <div class="row">
      <input class="grow" id="email" type="email" placeholder="your email" autocomplete="email">
      <button id="sendLink">Email me a link</button>
    </div>
    <p class="hint">Only admin accounts can change anything. You'll get a sign-in link by email.</p>
    <div class="msg" id="loginMsg"></div>
  </section>

  <div id="app" hidden>
    <section class="card">
      <h2>Ban a player</h2>
      <div class="row">
        <input class="code" id="banCode" placeholder="CODE" maxlength="12">
        <input class="grow" id="banReason" placeholder="Reason (shown to them on the ban screen)">
        <button id="banBtn">Ban</button>
      </div>
      <p class="hint">The player code is under their name tag in-game, or in Recent Players. Bans apply within ~15 seconds.</p>
      <div class="msg" id="banMsg"></div>
    </section>

    <section class="card">
      <div class="row" style="margin-bottom:12px">
        <h2 style="margin:0">Bans <span id="banCount"></span></h2>
        <input class="search" id="search" placeholder="Search code or reason">
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <table>
        <thead><tr><th>Code</th><th>Reason</th><th>When</th><th>By</th><th></th></tr></thead>
        <tbody id="bans"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>In-game admin keys</h2>
      <div class="row" style="margin-bottom:12px">
        <input class="grow" id="keyIn" placeholder="Admin key, e.g. 3FA9 12C0 77DE 0B41" style="font-family:ui-monospace,Consolas,monospace">
        <input id="keyNote" placeholder="Note (e.g. my Quest)">
        <button id="keyBtn">Add</button>
      </div>
      <table>
        <thead><tr><th>Key</th><th>Note</th><th>Added</th><th></th></tr></thead>
        <tbody id="keys"></tbody>
      </table>
      <div class="msg" id="keyMsg"></div>
    </section>
  </div>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient("https://lnwcjmwfwvojieavhcpx.supabase.co", "sb_publishable_6uEkR2y5Gx76WSTf3jCOVA_P2UtvkUP");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => t ? new Date(t).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
const msg = (el, text, ok = false) => { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); };
const pretty = (k) => k.replace(/(.{4})(?=.)/g, "$1 ");
let bans = [];

async function show() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").hidden = !!session;
  $("app").hidden = !session;
  $("logout").hidden = !session;
  $("who").textContent = session ? session.user.email : "";
  if (session) { loadBans(); loadKeys(); }
}

$("sendLink").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return;
  $("sendLink").disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.href.split("#")[0] } });
  $("sendLink").disabled = false;
  error ? msg($("loginMsg"), error.message) : msg($("loginMsg"), "Check your email for the sign-in link.", true);
};
$("logout").onclick = async () => { await sb.auth.signOut(); show(); };
sb.auth.onAuthStateChange(() => show());

async function loadBans() {
  const { data, error } = await sb.from("bans").select("*").order("created_at", { ascending: false });
  if (error) return msg($("banMsg"), error.message);
  bans = data;
  drawBans();
}
function drawBans() {
  const q = $("search").value.trim().toUpperCase();
  const rows = bans.filter((b) => !q || b.code.includes(q) || (b.reason || "").toUpperCase().includes(q));
  $("banCount").textContent = `(${bans.length})`;
  $("bans").innerHTML = rows.length ? rows.map((b) => `<tr>
      <td class="mono">#${esc(b.code)}</td><td>${esc(b.reason)}</td>
      <td class="when">${when(b.created_at)}</td><td class="mono when">${esc(b.banned_by || "")}</td>
      <td><button class="danger" data-unban="${esc(b.code)}">Unban</button></td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">No bans${q ? " match" : " yet"}.</td></tr>`;
}
$("search").oninput = drawBans;
$("refresh").onclick = () => { loadBans(); loadKeys(); };

$("banBtn").onclick = async () => {
  const code = $("banCode").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const reason = $("banReason").value.trim() || "No reason given";
  if (code.length < 4) return msg($("banMsg"), "Enter the player code (6 letters/numbers).");
  const { data: { session } } = await sb.auth.getSession();
  const { error } = await sb.from("bans").upsert({ code, reason, banned_by: session.user.email });
  if (error) return msg($("banMsg"), error.message.includes("row-level") ? "Your account isn't an admin." : error.message);
  msg($("banMsg"), `Banned #${code}.`, true);
  $("banCode").value = ""; $("banReason").value = "";
  loadBans();
};
$("bans").onclick = async (e) => {
  const code = e.target.dataset?.unban;
  if (!code || !confirm(`Unban #${code}?`)) return;
  const { error, count } = await sb.from("bans").delete({ count: "exact" }).eq("code", code);
  if (error || count === 0) return msg($("banMsg"), error ? error.message : "Couldn't unban (is your account an admin?)");
  msg($("banMsg"), `Unbanned #${code}.`, true);
  loadBans();
};

async function loadKeys() {
  const { data, error } = await sb.from("admins").select("*").order("created_at");
  if (error) return msg($("keyMsg"), error.message);
  $("keys").innerHTML = data.length ? data.map((k) => `<tr>
      <td class="mono">${esc(pretty(k.key))}</td><td>${esc(k.note || "")}</td><td class="when">${when(k.created_at)}</td>
      <td><button class="danger" data-key="${esc(k.key)}">Remove</button></td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No admin keys.</td></tr>`;
}
$("keyBtn").onclick = async () => {
  const key = $("keyIn").value.toUpperCase().replace(/[^0-9A-F]/g, "");
  if (key.length !== 16) return msg($("keyMsg"), "An admin key is 16 characters (0-9, A-F).");
  const { error } = await sb.from("admins").upsert({ key, note: $("keyNote").value.trim() || null });
  if (error) return msg($("keyMsg"), error.message.includes("row-level") ? "Your account isn't an admin." : error.message);
  msg($("keyMsg"), "Admin key added.", true);
  $("keyIn").value = ""; $("keyNote").value = "";
  loadKeys();
};
$("keys").onclick = async (e) => {
  const key = e.target.dataset?.key;
  if (!key || !confirm(`Remove admin key ${pretty(key)}?`)) return;
  const { error, count } = await sb.from("admins").delete({ count: "exact" }).eq("key", key);
  if (error || count === 0) return msg($("keyMsg"), error ? error.message : "Couldn't remove (is your account an admin?)");
  loadKeys();
};

show();
</script>
</body>
</html>
